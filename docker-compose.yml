services:
  nginx:
    image: nginx:1.27-alpine
    container_name: migrate-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./app:/var/www/html
      - ./panel-app:/var/www/panel
    depends_on:
      - php
      - panel-php
    networks:
      - migrate

  php:
    build:
      context: ./php
    container_name: migrate-php
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./app:/var/www/html
    depends_on:
      - mysql
    networks:
      - migrate

  panel-php:
    build:
      context: ./php-panel
    container_name: panel-php
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_DATABASE: isp_panel
      DB_USERNAME: migrate
      DB_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./panel-app:/var/www/panel
    depends_on:
      - mysql
    networks:
      - migrate

  mysql:
    image: mysql:8.0
    container_name: migrate-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: --default-authentication-plugin=caching_sha2_password
    volumes:
      - mysql-data:/var/lib/mysql
    # Dışarı port AÇILMAZ — sadece iç docker ağı üzerinden erişilir.
    networks:
      - migrate

  redis:
    image: redis:7-alpine
    container_name: panel-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - migrate

  minio:
    image: minio/minio:latest
    container_name: migrate-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    # Host'a port yayınlanmaz — panel iç ağdan http://minio:9000 ile erişir.
    # (Tarayıcı-erişimi gerekirse s3.wexconnect.com.tr vhost'u sonra eklenir.)
    networks:
      - migrate

volumes:
  mysql-data:
  minio-data:
  redis-data:

networks:
  migrate:
    driver: bridge
